name: Backend QA

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Quality Checks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    # Prevent forked repositories from executing code on the
    # company's self-hosted runner or receiving repository secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      PORT: "3000"
      NODE_ENV: development
      APP_ENV: local
      CORS_ALLOWED_ORIGINS: http://localhost:3001

      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN_SECONDS: "86400"

      EMAIL_VERIFICATION_EXPIRES_IN_SECONDS: "300"
      RESET_PASSWORD_TOKEN_EXPIRES_IN_SECONDS: "600"

      # Disable background and external integrations during PR validation.
      MAIL_QUEUE_ENABLED: "false"

      STORAGE_PROVIDER: vps
      STORAGE_ENV: local
      VPS_STORAGE_ROOT: ./storage

      PAYMONGO_MODE: test
      PAYMONGO_ALLOW_PROVIDER_FALLBACK: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Dependencies and Generate Prisma Client
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Type Check
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Prepare QA Reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null

          # Ensure an artifact exists even if Semgrep setup or execution fails.
          @{
            status = "Semgrep did not complete"
            findings = @()
          } | ConvertTo-Json | Set-Content reports/semgrep.json

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.168.0
          semgrep --version

      # Advisory only:
      # Findings do not automatically block the developer.
      - name: Security Scan with Semgrep
        id: semgrep
        continue-on-error: true
        shell: pwsh
        run: |
          semgrep scan `
            --config auto `
            --error `
            --json `
            --output reports/semgrep.json `
            src

      - name: Add Backend QA Summary
        if: always()
        shell: pwsh
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          @"
          ## Backend QA Summary

          | Check | Result |
          |---|---|
          | Dependency installation | Completed before this summary |
          | Prisma Client generation | Completed during npm ci |
          | Prisma schema validation | Completed before this summary |
          | TypeScript typecheck | Completed before this summary |
          | Backend build | Completed before this summary |
          | Semgrep security scan | $env:SEMGREP_OUTCOME |

          ### Review policy

          **Hard blockers**

          - Dependency installation failure
          - Prisma generation or validation failure
          - TypeScript typecheck failure
          - Backend build failure

          **Advisory findings**

          - Semgrep findings require developer review.
          - The developer may fix the finding or explain why it is a false positive.
          - QA makes the final decision before merge.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-semgrep-report-${{ github.run_number }}
          path: reports/semgrep.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0