name: Backend QA

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Quality Checks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    # Prevent fork PRs from using company secrets and the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      PORT: "3000"
      NODE_ENV: development
      APP_ENV: local
      CORS_ALLOWED_ORIGINS: http://localhost:3001

      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN_SECONDS: "86400"

      EMAIL_VERIFICATION_EXPIRES_IN_SECONDS: "300"
      RESET_PASSWORD_TOKEN_EXPIRES_IN_SECONDS: "600"

      MAIL_QUEUE_ENABLED: "false"

      STORAGE_PROVIDER: vps
      STORAGE_ENV: local
      VPS_STORAGE_ROOT: ./storage

      PAYMONGO_MODE: test
      PAYMONGO_ALLOW_PROVIDER_FALLBACK: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Dependencies and Generate Prisma Client
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Type Check
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Prepare QA Reports
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null

          $initialReport = @{
            status = "Semgrep did not complete"
            findings = @()
          }

          $initialReport |
            ConvertTo-Json -Depth 10 |
            Set-Content -Path reports/semgrep.json -Encoding UTF8

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep==1.168.0
          semgrep --version

      # Advisory only. Findings will not automatically block the PR.
      - name: Security Scan with Semgrep
        id: semgrep
        continue-on-error: true
        shell: powershell
        run: |
          semgrep scan `
            --config auto `
            --error `
            --json `
            --output reports/semgrep.json `
            src

      - name: Add Backend QA Summary
        if: always()
        shell: powershell
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          $summary = @(
            "## Backend QA Summary"
            ""
            "| Check | Result |"
            "|---|---|"
            "| Dependency installation | Completed |"
            "| Prisma Client generation | Completed during npm ci |"
            "| Prisma schema validation | Completed |"
            "| TypeScript typecheck | Completed |"
            "| Backend build | Completed |"
            "| Semgrep security scan | $env:SEMGREP_OUTCOME |"
            ""
            "### Review policy"
            ""
            "**Hard blockers**"
            ""
            "- Dependency installation failure"
            "- Prisma generation or validation failure"
            "- TypeScript typecheck failure"
            "- Backend build failure"
            ""
            "**Advisory findings**"
            ""
            "- Semgrep findings require developer review."
            "- The developer may fix the issue or explain why it is a false positive."
            "- QA makes the final decision before merge."
          )

          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-semgrep-report-${{ github.run_number }}
          path: reports/semgrep.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0