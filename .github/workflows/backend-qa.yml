name: Backend QA

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Quality Checks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      PORT: "3000"
      NODE_ENV: development
      APP_ENV: local
      CORS_ALLOWED_ORIGINS: http://localhost:3001

      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}

      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN_SECONDS: "86400"

      EMAIL_VERIFICATION_EXPIRES_IN_SECONDS: "300"
      RESET_PASSWORD_TOKEN_EXPIRES_IN_SECONDS: "600"

      MAIL_QUEUE_ENABLED: "false"

      STORAGE_PROVIDER: vps
      STORAGE_ENV: local
      VPS_STORAGE_ROOT: ./storage

      PAYMONGO_MODE: test
      PAYMONGO_ALLOW_PROVIDER_FALLBACK: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies and Generate Prisma Client
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Type Check
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Prepare QA Reports
        shell: powershell
        run: New-Item -ItemType Directory -Force reports | Out-Null

      - name: Security Scan with Semgrep
        id: semgrep
        continue-on-error: true
        shell: powershell
        run: |
          python -m pip install semgrep==1.168.0
          semgrep scan `
            --config auto `
            --error `
            --json `
            --output reports/semgrep.json `
            src

      - name: Add QA Summary
        if: always()
        shell: powershell
        run: |
          "## Backend QA Summary" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Dependency installation and Prisma generation completed." >> $env:GITHUB_STEP_SUMMARY
          "- Prisma schema validation completed." >> $env:GITHUB_STEP_SUMMARY
          "- TypeScript typecheck completed." >> $env:GITHUB_STEP_SUMMARY
          "- Backend build completed." >> $env:GITHUB_STEP_SUMMARY
          "- Semgrep is currently advisory and requires developer/QA review." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-semgrep-report-${{ github.run_number }}
          path: reports/semgrep.json
          if-no-files-found: warn
          retention-days: 14