name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    steps:
      - name: Deploy backend staging
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "I:\Gr8BooksNeo\apps\backend-shared-dev"

          git fetch origin staging:refs/remotes/origin/staging
          git reset --hard origin/staging

          pm2 stop gr8booksneo-backend-shared-dev

          npm ci

          node scripts/run-with-env.cjs .env prisma migrate deploy
          node scripts/run-with-env.cjs .env prisma generate
          node scripts/run-with-env.cjs .env prisma migrate status

          npm run build

          pm2 startOrRestart ecosystem.config.cjs --update-env
          pm2 save
